services:

  postgres:
    image: postgres:18
    container_name: tangle-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

    ports:
      - "5433:5432"

    volumes:
      - tangle_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: tangle-backend
    restart: unless-stopped

    environment:
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}

      TANGLE_JWT_SECRET_KEY: ${TANGLE_JWT_SECRET_KEY}
      TANGLE_JWT_ALGORITHM: ${TANGLE_JWT_ALGORITHM}
      TANGLE_JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${TANGLE_JWT_ACCESS_TOKEN_EXPIRE_MINUTES}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  tangle_postgres_data: